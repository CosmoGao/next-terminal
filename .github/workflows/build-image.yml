name: Build image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: web
        env:
          # react-scripts 5 still uses Webpack's old OpenSSL hash on Node 17+.
          NODE_OPTIONS: --openssl-legacy-provider
          # GitHub sets CI=true, which makes react-scripts fail the build on warnings.
          CI: "false"
        run: |
          npm install --global yarn
          # No yarn.lock is committed. A current transitive dependency requires Node 22.
          yarn install
          yarn build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64
          # Load a Docker schema 2 image, then push it. Buildx's default
          # OCI index (provenance) is rejected by the QNAP Docker daemon
          # as "manifest unknown".
          load: true
          provenance: false
          sbom: false
          tags: ghcr.io/cosmogao/aegis-terminal:main
      - name: Push image
        run: docker push ghcr.io/cosmogao/aegis-terminal:main

  guacd:
    name: Build guacd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: guacd/Dockerfile.ci
          platforms: linux/amd64
          load: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/cosmogao/guacd:1.4.0
            ghcr.io/cosmogao/guacd:main
      - name: Push image
        run: |
          docker push ghcr.io/cosmogao/guacd:1.4.0
          docker push ghcr.io/cosmogao/guacd:main

